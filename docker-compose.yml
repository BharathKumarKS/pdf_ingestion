services:
  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: synapse_qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  memgraph:
    image: memgraph/memgraph:2.18.1
    container_name: synapse_memgraph
    ports:
      - "7687:7687"   # Bolt protocol
      - "7444:7444"   # Management API
    volumes:
      - memgraph_data:/var/lib/memgraph
    environment:
      MEMGRAPH_USER: memgraph
      MEMGRAPH_PASSWORD: synapse
    healthcheck:
      test: ["CMD", "mg_client", "--host", "localhost", "--port", "7687", "-u", "memgraph", "-p", "synapse", "--execute", "RETURN 1;"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    profiles: ["phase3"]  # Only started in Phase 3+

  minio:
    image: minio/minio:latest
    container_name: synapse_minio
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: synapse
      MINIO_ROOT_PASSWORD: synapse123
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    profiles: ["phase3"]  # Only started in Phase 3+

volumes:
  qdrant_data:
    name: synapse_qdrant_data
  memgraph_data:
    name: synapse_memgraph_data
  minio_data:
    name: synapse_minio_data
