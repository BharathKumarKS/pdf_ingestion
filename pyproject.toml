[project]
name = "synapse-learning"
version = "0.1.0"
description = "Synapse Learning Worlds — Hybrid RAG Platform"
requires-python = ">=3.11"

dependencies = [
    # Config & validation
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",

    # Database
    "sqlmodel>=0.0.19",
    "aiosqlite>=0.20",

    # Vector store
    "qdrant-client>=1.11",

    # Document parsing
    "docling>=2.5",

    # Chunking
    "chonkie[semantic]>=0.3",

    # Embeddings
    "sentence-transformers>=3.1",
    "transformers>=4.44,<5.0",   # Jina v3 custom LoRA code breaks on transformers 5.x
    "torch>=2.3",
    "numpy>=1.26",
    "einops>=0.8",

    # API
    "fastapi>=0.112",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",

    # Frontend
    "streamlit>=1.37",

    # Clustering (RAPTOR tree) — umap-learn is optional, GMM falls back to raw embeddings
    "scikit-learn>=1.5",

    # Phase 3 — ColPali visual embeddings
    "colpali-engine>=0.3.1",
    "Pillow>=10.4",

    # Phase 3 — Memgraph / Neo4j Bolt driver
    "neo4j>=5.20",

    # Phase 3 — MinIO SDK (used when IMAGE_STORE_BACKEND=minio)
    "minio>=7.2",

    # Utilities
    "loguru>=0.7",
    "rich>=13.7",
    "tqdm>=4.66",
    "tenacity>=8.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "fpdf2>=2.7",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: marks tests that download models or use real infrastructure",
    "integration: marks full end-to-end pipeline tests",
    "unit: marks fast isolated unit tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
